name: Quality

# Reusable workflow: the test suite and the code style check.
# Called by ci.yml on pull requests and by build.yml before it builds and
# ships the assets to the deploy repository.
on:
  workflow_call:

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8.4 is what developers run, 8.5 is what production runs.
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, fileinfo, gd, intl, mbstring, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer files
        run: composer validate --strict --no-check-publish

      - name: Cache composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php${{ matrix.php }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # The suite runs on an in-memory SQLite database (see phpunit.xml), so no
      # database service is needed here.
      - name: Run the test suite
        run: php artisan test --compact

  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Cache composer packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-php8.4-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php8.4-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check the code style
        run: vendor/bin/pint --test
